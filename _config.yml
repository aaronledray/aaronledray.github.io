# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Aaron P. Ledray
tagline: Metallobiochemistry, enzyme design, and research software.
author: Aaron P. Ledray
email: aaronledray@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  I am a metallobiochemist working at the experiment–theory–simulation interface. I study enzyme design, metal-centered reactivity, and research software.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://aaronledray.github.io" # the base hostname & protocol for your site
#twitter_username: jekyllrb
github_username:  aaronledray
goatcounter_code: aaronledray # <- replace with your actual GoatCounter site code from signup

social:
  name: Aaron P. Ledray
  links:
    - https://github.com/aaronledray
    - https://www.linkedin.com/in/aaronledray
    - https://orcid.org/0000-0002-1829-1235

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Temporarily hide the portfolio and its artwork from the generated site while
# preserving the source files in the repository for a future return.
exclude:
  - portfolio.md
  - assets/images/art1.png
  - assets/images/ACS_JournalCover.png
  - tools/index.md
  - InteractiveCoordinationFingerprint.html
  - InteractiveCoordinationFingerprint_1apx.html
  - InteractiveCoordinationFingerprint_2gep.html
  - assets/videos/20260708_heme-copper-oxidase_heatmap.mp4
  - assets/videos/20260708_heme-copper-oxidase_heatmap_playable.mp4
  - assets/videos/20260708_heme-copper-oxidase_heatmap_websafe.mp4
  - lighthouse_results/
