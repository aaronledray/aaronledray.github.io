summary: >
  Metallobiochemist working at the experiment–theory–simulation interface, with research spanning protein design,
  enzyme mechanisms, and single-atom–resolution spectroscopy. Experienced in integrating spectroscopy,
  computation, and molecular biology to resolve metal-centered reactivity in biological systems
  and to design functional metalloproteins.

