experience:
  - title: Postdoctoral Research Fellow
    institution: University of Texas at Austin
    location: Austin, TX, USA
    years: 2021–present
    lab: Laboratory of Dr. Yi Lu – green biochemistry and enzyme design
    highlights:
      - "Simulated O₂ binding across several hundred heme protein homologues; applied machine-learning voxel representations to predict enzyme reactivity and metal binding in designed structures. Presented at the Texas Advanced Computing Center User Meeting (2023)."
      - "Designed novel metallo-DNAzymes that mimic heme peroxidase enzymes."
      - "Developed and characterized next-generation model systems for heme–copper oxidase, sulfite reductase (4Fe4S-heme and heme-copper types), and nitrogenase."
      - "Engineered DNA-aptamer–based delivery systems for fluorescent cargo across blood–brain barrier model systems."
      - "Designed kinetic experiments to resolve competing pathways and extract rate behavior."
      - "Built Python-based workflows for processing, modeling, and comparing experimental datasets."
      - "Refined reaction conditions and assay parameters to improve robustness and reproducibility."

  - title: Graduate Research Assistant
    institution: University of California, Irvine
    location: Irvine, CA, USA
    years: 2015–2021
    lab: Laboratory of Dr. Michael T. Green – heme enzyme reactivity
    highlights:
      - "Established that peroxidase Compound II is an unprotonated Fe(IV)=O species using a multi-spectroscopic approach, resolving a long-standing mechanistic debate."
      - "Simulated NRVS spectra of heme enzyme intermediates to validate experimental assignments."
      - "Reprocessed neutron crystallography datasets using electron diffraction maps, identifying sample-damage artifacts responsible for conflicting literature interpretations."

  - title: Undergraduate Research Assistant
    institution: University of Central Florida
    location: Orlando, FL, USA
    years: 2013–2015
    lab: Laboratory of Dr. Stephen J. King – neurodegenerative disease models
    highlights:
      - "Behavioral studies in a novel mouse model of Charcot–Marie–Tooth neuropathy, including statistical analysis and scripting."
      - "3D confocal microscopy and quantitative morphology analysis of murine neuromuscular junctions."
      - "Developed fluorescence-based assays to quantify intracellular transport and trafficking in neuronal systems."
      - "Performed quantitative imaging and MATLAB-based analysis of cellular distribution and dynamics."
      - "Conducted dose-response experiments to evaluate toxicity and transport behavior of small molecules."

skills:
  - category: Assay Development & Experimental Systems
    items:
      - Design and optimization of biochemical and cell-based assays
      - Fluorescence-based readouts for transport, uptake, and reaction systems
      - Signal optimization, reproducibility, and endpoint selection
      - Plate-reader-based assays (fluorescence and UV/Vis) for high-throughput enzymatic activity screening
      - Binding and thermodynamic assays (isothermal titration calorimetry, surface plasmon resonance)

  - category: Reaction Systems & Enzymology
    items:
      - Oxygen reduction and sulfite reduction reaction systems
      - Redox chemistry, reaction kinetics, and competing pathway analysis
      - Control of reaction conditions and intermediate behavior

  - category: Cell-Based & Imaging Systems
    items:
      - Fluorescent cargo uptake and intracellular trafficking assays
      - Human cell lines and primary neurons
      - Quantitative fluorescence microscopy and image analysis
      - Flow cytometry

  - category: Data Analysis & Modeling
    items:
      - Python (pandas, scikit-learn), kinetic modeling, statistical analysis
      - Custom pipelines for processing and interpreting experimental datasets
      - Visualization and structured data outputs

  - category: Experimental Design & Optimization
    items:
      - Protocol development, troubleshooting, and QC workflows
      - Assay performance tuning in complex, interference-prone systems

  - category: Biochemistry & Enzymology
    items:
      - Protein engineering
      - Enzyme kinetics and mechanisms
      - Structural biology
      - Bioinorganic and metalloprotein chemistry
      - Neutron crystallography and electron diffraction data analysis
      - X-ray protein crystallography (crystallization and structure determination)

  - category: Spectroscopy
    items:
      - UV/Vis spectroscopy
      - Mössbauer spectroscopy
      - Resonance Raman spectroscopy
      - X-ray Absorption Spectroscopy (XAS), Extended X-ray Absorption Fine Structure (EXAFS)
      - Nuclear Resonance Vibrational Spectroscopy (NRVS)
      - Electron Paramagnetic Resonance (EPR) spectroscopy (X-band, Q-band, W-band)
      - Circular Dichroism (CD) spectroscopy
      - "Synchrotron beamline data collection: XAS/EXAFS at SSRL; NRVS at APS (Argonne National Laboratory)"
      - NMR spectroscopy (small-molecule/product characterization)

  - category: Molecular & Cell Biology
    items:
      - Molecular cloning and construct design
      - Protein expression and purification in bacterial and eukaryotic systems
      - "Genetic code expansion: site-specific incorporation of non-canonical amino acids (e.g., 4-azido-phenyltyrosine)"
      - Chromatographic protein purification (FPLC, HPLC, size-exclusion, affinity, ion-exchange)
      - PCR and site-directed mutagenesis
      - Gel electrophoresis (SDS-PAGE, agarose) and western blotting
      - Mass spectrometry (MALDI-TOF) for protein purity and identity assessment

  - category: Electrochemistry & Bioconjugation
    items:
      - Bioorthogonal click chemistry (azide–alkyne) for site-specific protein functionalization
      - Protein immobilization on gold electrode surfaces via thiol linkers
      - Cyclic voltammetry (CV), square-wave voltammetry (SWV), and electrochemical impedance spectroscopy (EIS)

  - category: In Vivo & Animal Model Research
    items:
      - Live-animal behavioral assays in mouse models of neurodegenerative disease
      - Intracranial and systemic injections and tissue harvesting (brain, muscle)
      - Volumetric and neuronal branching analysis of neuromuscular junctions via confocal microscopy

  - category: DNA Nanotechnology & Aptamer Engineering
    items:
      - Aptamer engineering and experimental design, including delivery and control constructs
      - Development of fluorescent aptamer-based biosensors (e.g., for labile heme)
      - DNA as a structural scaffold for metallocatalysis

  - category: Computational Chemistry & Molecular Modeling
    items:
      - Protein homology modeling and molecular docking
      - Molecular dynamics simulations (GROMACS, AMBER; free energy calculations, macromolecular interactions, active-site dynamics)
      - Quantum chemistry and hybrid QM/MM methods (Gaussian, ORCA, CP2K)
      - Protein design and modeling (Rosetta, RFdiffusion, ESMFold, AlphaFold)
      - Molecular visualization and analysis (PyMOL, ChimeraX, VMD, Avogadro)
